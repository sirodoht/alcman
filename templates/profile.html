{% extends "layout.html" %}

{% block title %}profile{% endblock title %}

{% block content %}
<section>
    <div class="page-row">
        <div class="page-header">
            <h1>{{ username }}</h1>
            <p>profile</p>
        </div>
    </div>

    {% if let Some(did) = did %}
    <div class="page-row">
        <div class="page-content">
            <span class="page-label">DID</span>
            <span class="page-value">{{ did }}</span>
        </div>
    </div>
    {% endif %}

    <div class="page-row">
        <div class="page-content">
            <span class="page-label">books</span>
            <span class="page-value">{{ book_count }}</span>
        </div>
    </div>

    <div class="page-row">
        <div class="page-content page-actions">
            <a href="/profile/password" class="btn">change password</a>
            <form method="post" action="/logout">
                <input type="submit" value="logout" class="btn">
            </form>
        </div>
    </div>
</section>
{% endblock content %}
